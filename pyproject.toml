[project]
name = "pocketbook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "ofxparse>=0.21",
    "plaid-python>=40.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rapidfuzz>=3.14.5",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
exclude = [
    ".git",
    ".pytest_cache",
    ".vscode",
    "build",
    "dist",
    "node_modules",
    "site-packages"
]
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.lint]
ignore = []
fixable = ["ALL"]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["backend/tests"]
